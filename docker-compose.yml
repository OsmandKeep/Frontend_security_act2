services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: security-frontend
    ports:
      - "80:80"
    environment:
      - API_KEY=${API_KEY:-my-secret-key}
      - API_UPSTREAM=${API_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
